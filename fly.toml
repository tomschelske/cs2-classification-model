# Fly.io config for the CS2 win-probability dashboard.
# Set `app` to the name you create with `fly apps create` (Fly names are globally
# unique, so you may need a suffix). Change `primary_region` to one near you
# (`fly platform regions` lists them).
app = "cs2-winprob"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000       # matches the app's default $PORT in the Dockerfile
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle (near-free; a few-second
  auto_start_machines = true    # cold start on the next request)
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"           # headroom for the scikit-learn / scipy import
