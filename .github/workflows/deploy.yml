name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install serving + test deps
        run: pip install -r requirements-serve.txt -r requirements-test.txt
      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy only once FLY_API_TOKEN is configured; until then the pipeline
      # still passes (tests run, deploy is skipped) instead of failing red.
      - name: Check for Fly token
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "No FLY_API_TOKEN secret set — skipping deploy. Add it to enable."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.deploy == 'true'
      - name: Deploy to Fly.io (builds the image remotely)
        if: steps.fly.outputs.deploy == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
