name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install serving + test deps
        run: pip install -r requirements-serve.txt -r requirements-test.txt
      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy only once GCP_SA_KEY is configured; until then the pipeline still
      # passes (tests run, deploy is skipped) instead of failing red.
      - name: Check for GCP credentials
        id: gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "No GCP_SA_KEY secret set — skipping deploy. Add it to enable."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.gcp.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        if: steps.gcp.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        if: steps.gcp.outputs.deploy == 'true'
        run: |
          gcloud run deploy cs2-winprob \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1        # cost cap: bounds spend no matter the traffic
